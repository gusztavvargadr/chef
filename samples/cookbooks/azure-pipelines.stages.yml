parameters:
  configurations: []
    # - name: string
    #   instances: [ string ]

stages:
  - stage: commit
    displayName: Commit

    jobs:
      - ${{ each configuration in parameters.configurations }}:
        - job: build_${{ replace(configuration.name, '-', '_') }}
          displayName: Build cookbook ${{ configuration.name }}

          pool:
            name: default
            demands:
              - VSTS_AGENT_CAP_CHEF -equals build

          workspace:
            clean: all

          steps:
            - checkout: self
              submodules: recursive

            - script: |
                dotnet --info
                dotnet tool restore
              displayName: Initialize build

            - script: |
                dotnet cake --configuration ${{ configuration.name }} --target commit
              displayName: Run build

            - publish: artifacts
              displayName: Publish artifacts
              artifact: ${{ configuration.name }}

            - script: |
                dotnet cake --configuration ${{ configuration.name }} --target commit-clean
              displayName: Clean build
              condition: always()

  - stage: acceptance
    displayName: Acceptance

    jobs:
      - ${{ each configuration in parameters.configurations }}:
        - ${{ each instance in configuration.instances }}:
          - job: test_${{ replace(configuration.name, '-', '_') }}_${{ replace(instance, '-', '_') }}
            displayName: Test cookbook ${{ configuration.name }} on instance ${{ instance }}

            pool:
              name: default
              demands:
                - VSTS_AGENT_CAP_CHEF -equals test
                - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER

            workspace:
              clean: all

            steps:
              - checkout: self
                submodules: recursive

              - script: |
                  dotnet --info
                  dotnet tool restore
                displayName: Initialize build

              - script: |
                  dotnet cake --configuration ${{ configuration.name }}/${{ instance }} --target acceptance
                displayName: Run build

              - script: |
                  dotnet cake --configuration ${{ configuration.name }}/${{ instance }} --target acceptance-clean
                displayName: Clean build
                condition: always()

  - stage: publish
    displayName: Publish

    jobs:
      - ${{ each configuration in parameters.configurations }}:
        - job: publish_${{ replace(configuration.name, '-', '_') }}
          displayName: Publish cookbook ${{ configuration.name }}

          pool:
            name: default
            demands:
              - VSTS_AGENT_CAP_CHEF -equals build

          workspace:
            clean: all

          steps:
            - checkout: none

            - download: current
              displayName: Download artifacts
              artifact: ${{ configuration.name }}

            - task: GitHubRelease@1
              displayName: Publish to release rolling
              condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
              inputs:
                gitHubConnection: github-releases
                repositoryName: $(Build.Repository.Name)
                action: edit
                tag: rolling
                assets: $(Pipeline.Workspace)/${{ configuration.name }}/*.tgz
                assetUploadMode: replace
                isDraft: false
                makeLatest: 'true'
                addChangeLog: false

            - task: GitHubRelease@1
              displayName: Publish to release rolling-draft
              condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
              inputs:
                gitHubConnection: github-releases
                repositoryName: $(Build.Repository.Name)
                action: edit
                tag: rolling-draft
                assets: $(Pipeline.Workspace)/${{ configuration.name }}/*.tgz
                assetUploadMode: replace
                isDraft: true
                makeLatest: 'false'
                addChangeLog: false
