parameters:
  configurations: []
    # - name: string
    #   instances: [ string ]

stages:
  - stage: commit
    displayName: Commit

    jobs:
      - ${{ each configuration in parameters.configurations }}:
        - job: build_${{ replace(configuration.name, '-', '_') }}
          displayName: Build cookbook ${{ configuration.name }}

          pool:
            vmImage: ubuntu-22.04

          container: gusztavvargadr/chef-workstation:linux-ubuntu-22.04

          workspace:
            clean: all

          steps:
            - checkout: self
              submodules: recursive

            - script: |
                dotnet --info
                dotnet tool restore
              displayName: Initialize build

            - script: |
                dotnet cake --configuration ${{ configuration.name }} --target commit
              displayName: Run build

            - publish: artifacts
              displayName: Publish artifacts
              artifact: ${{ configuration.name }}

            - script: |
                dotnet cake --configuration ${{ configuration.name }} --target commit-clean
              displayName: Clean build
              condition: always()

  - stage: acceptance
    displayName: Acceptance

    jobs:
      - ${{ each configuration in parameters.configurations }}:
        - ${{ each instance in configuration.instances }}:
          - job: test_${{ replace(configuration.name, '-', '_') }}_${{ replace(instance, '-', '_') }}
            displayName: Test cookbook ${{ configuration.name }} on instance ${{ instance }}

            ${{ if contains(instance, 'windows') }}:
              pool:
                name: default
                demands:
                  - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER -equals hyperv

            ${{ if contains(instance, 'ubuntu') }}:
              pool:
                name: default
                demands:
                  - VSTS_AGENT_CAP_VIRTUALIZATION_PROVIDER -equals qemu

            workspace:
              clean: all

            steps:
              - checkout: self
                submodules: recursive

              - script: |
                  dotnet --info
                  dotnet tool restore
                displayName: Initialize build

              - script: |
                  dotnet cake --configuration ${{ configuration.name }}/${{ instance }} --target acceptance
                displayName: Run build

              - script: |
                  dotnet cake --configuration ${{ configuration.name }}/${{ instance }} --target acceptance-clean
                displayName: Clean build
                condition: always()
