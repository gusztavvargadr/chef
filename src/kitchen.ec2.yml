driver:
  name: ec2
  region: eu-west-1
  instance_type: c7i.xlarge
  spot_price: on-demand
  ebs_optimized: true
  block_device_mappings:
    - device_name: /dev/sda1
      ebs:
        volume_type: gp3
        volume_size: 127
  tags:
    Stack: gusztavvargadr-chef

provisioner:
  name: chef_infra
  require_chef_omnibus: 18.11.11
  chef_omnibus_url: https://omnitruck.cinc.sh/stable/cinc/install.sh
  chef_omnibus_root: /opt/cinc
  max_retries: 0

verifier:
  name: inspec

platforms:
  - name: windows-2022
    driver:
      image_search:
        owner-id: "668508375233"
        name: "*kitchen-windows-2022*"
      tags:
        Service: kitchen-windows-2022
    provisioner:
      chef_omnibus_root: $env:systemdrive\cinc-project\cinc
    transport:
      elevated: true

  - name: ubuntu-2404
    driver:
      image_search:
        owner-id: "668508375233"
        name: "*kitchen-ubuntu-2404*"
      tags:
        Service: kitchen-ubuntu-2404
    provisioner:
      root_path: /var/tmp/kitchen

  - name: ubuntu-2204
    driver:
      image_search:
        owner-id: "668508375233"
        name: "*kitchen-ubuntu-2204*"
      tags:
        Service: kitchen-ubuntu-2204
    provisioner:
      root_path: /var/tmp/kitchen
