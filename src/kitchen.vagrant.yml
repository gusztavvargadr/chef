driver:
  name: vagrant
  vm_hostname: false
  vagrantfile_erb: ../../../src/kitchen.Vagrantfile.erb
  vagrantfiles:
    - ../../../src/kitchen.Vagrantfile

provisioner:
  name: chef_infra
  product_name: chef
  product_version: 18.10.17
  install_strategy: once
  max_retries: 0

verifier:
  name: inspec

platforms:
  - name: windows-2025
    driver:
      box: gusztavvargadr/kitchen-windows-2025
    transport:
      elevated: true

  - name: windows-2022
    driver:
      box: gusztavvargadr/kitchen-windows-2022
    transport:
      elevated: true

  - name: ubuntu-2404
    driver:
      box: gusztavvargadr/kitchen-ubuntu-2404
    provisioner:
      root_path: /var/tmp/kitchen

  - name: ubuntu-2204
    driver:
      box: gusztavvargadr/kitchen-ubuntu-2204
    provisioner:
      root_path: /var/tmp/kitchen
