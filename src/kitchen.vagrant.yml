driver:
  name: vagrant
  vm_hostname: false
  vagrantfile_erb: ../../../src/kitchen.Vagrantfile.erb
  vagrantfiles:
    - ../../../src/kitchen.Vagrantfile

provisioner:
  name: chef_infra
  require_chef_omnibus: 18.11.11
  chef_omnibus_url: https://omnitruck.cinc.sh/install.sh
  chef_omnibus_root: /opt/cinc
  max_retries: 0

verifier:
  name: inspec

platforms:
  - name: windows-2025
    driver:
      box: gusztavvargadr/kitchen-windows-2025
    provisioner:
      install_msi_url: https://packages.cinc.sh/files/stable/cinc/18.11.11/windows/2016/cinc-18.11.11-1-x64.msi
      chef_omnibus_root: $env:systemdrive\cinc-project\cinc
    transport:
      elevated: true

  - name: windows-2022
    driver:
      box: gusztavvargadr/kitchen-windows-2022
    provisioner:
      install_msi_url: https://packages.cinc.sh/files/stable/cinc/18.11.11/windows/2016/cinc-18.11.11-1-x64.msi
      chef_omnibus_root: $env:systemdrive\cinc-project\cinc
    transport:
      elevated: true

  - name: ubuntu-2404
    driver:
      box: gusztavvargadr/kitchen-ubuntu-2404
    provisioner:
      root_path: /var/tmp/kitchen

  - name: ubuntu-2204
    driver:
      box: gusztavvargadr/kitchen-ubuntu-2204
    provisioner:
      root_path: /var/tmp/kitchen
